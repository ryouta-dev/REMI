<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Меню столика — REMI</title>
  <link rel="icon" href="assets/favicon.svg">
  <link rel="stylesheet" href="ordering.css">
  <script type="module" src="qr.js"></script>
</head>
<body>
  <header class="top"><a class="brand" href="./">REMI</a><span id="table"></span></header>
  <main class="shell">
    <h1>Меню</h1>
    <p id="notice" role="status">Загружаем меню…</p>
    <nav id="categories" class="categories" aria-label="Категории меню"></nav>
    <div id="menu" class="menu-grid"></div>
    <section id="basket" hidden>
      <h2>Корзина</h2>
      <div id="basket-lines"></div>
      <p id="total"></p>
      <p id="feedback" role="status"></p>
      <button id="send" type="button">Отправить заказ</button>
    </section>
    <section id="orders" hidden aria-labelledby="orders-title">
      <h2 id="orders-title">Мои заказы</h2>
      <div id="order-list" class="stack"></div>
    </section>
  </main>
  <a class="dock" id="basket-link" href="#basket" hidden>Корзина</a>
</body>
</html>
